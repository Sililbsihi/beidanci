  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（纸感暖橙强调） === */
      --color-primary:              #C96F3D;
      --color-primary-container:    #F6DCC5;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（暖纸白） === */
      --color-background:                 #FBF3E7;
      --color-surface-container-lowest:   #FFFDFA;
      --color-surface:                    #FFF9F1;
      --color-surface-container:          #F4EADA;
      --color-surface-container-high:     #EEE1CE;
      --color-surface-container-highest:  #E7D6BF;
      /* === 文字 === */
      --color-on-surface:           #31251B;
      --color-on-surface-variant:   #8B7662;
      /* === 功能色（柔和纸感） === */
      --color-success:  #7E9F7A;
      --color-error:    #D96C5F;
      --color-warning:  #D9A13B;
      /* === 边框 === */
      --color-outline:          #D8C6B0;
      --color-outline-variant:  #EBDFCF;
      /* === 彩虹果冻色系（柔和彩虹线条与果冻点缀） === */
      --color-jelly-red:     #E57373;
      --color-jelly-orange:  #F0A45B;
      --color-jelly-yellow:  #E9C96A;
      --color-jelly-green:   #7E9F7A;
      --color-jelly-blue:    #7FA3C9;
      --color-jelly-purple:  #A88BC9;
      /* === 圆角（果冻圆润） === */
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.25rem;
      --radius-2xl:  1.75rem;
      --radius-full: 9999px;
      /* === 阴影（轻柔暖调） === */
      --shadow-card:   0 2px 12px rgba(139,118,98,0.10);
      --shadow-float:  0 10px 30px rgba(139,118,98,0.16);
      --shadow-dialog: 0 25px 50px rgba(139,118,98,0.20);
      /* === 字体 === */
      --font-sans: "Lora", "Noto Serif SC", Georgia, system-ui, serif;
      --font-display: Georgia, "Noto Serif SC", serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">
